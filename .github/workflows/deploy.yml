name: Deployment on Live Server

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  build:
    runs-on: [self-hosted, development]
    env:
      PORT: 3001
      MYSQL_HOST: localhost
      MYSQL_USER: dev
      MYSQL_PASSWORD: jL#4p@*9vT$!7
      MYSQL_DATABASE: mydoctracker_dev
      MYSQL_PORT: 3306
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 16.x
        uses: actions/setup-node@v3
        with:
          node-version: 16.x
      - run: npm install
      - run: pm2 restart backend
