name: Deployment on Dev Environment

on:
  push:
    branches: [ "develop" ]
jobs:
  build-deploy:
    runs-on: develop
 
    strategy:
      matrix:
        node-version: [18.x]

    env:
      PORT: 3001
      MYSQL_HOST: localhost
      MYSQL_USER: dev
      MYSQL_PASSWORD: jL#4p@*9vT$!7
      MYSQL_DATABASE: mydoctracker-dev
      MYSQL_PORT: 3306
  
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm i
    - run: npm run migration:run
    - run: npm run start
