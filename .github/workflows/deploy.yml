name: Deployment on Dev Environment

on:
  push:
    branches: [ "develop" ]
jobs:
  build-deploy:
    runs-on: development
 
    strategy:
      matrix:
        node-version: [18.x]
        
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: echo "Hello World";
