name: Deployment on Dev Environment

on:
  push:
    branches: ["develop"]
jobs:
  build-deploy:
    runs-on: develop

    strategy:
      matrix:
        node-version: [18.x]

    env:
      PORT: ${{ secrets.PORT }}
      MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
      MYSQL_USER: ${{ secrets.MYSQL_USER_DEV }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD_DEV }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE_DEV }}
      MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRE: ${{ secrets.JWT_EXPIRE }}
      API_KEY: ${{ secrets.API_KEY }}

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm i
      
      - name: Run migration for database
        run: npm run migration:run

      - name: Restart NestJS application
        run: npm run deploy:dev
        
        