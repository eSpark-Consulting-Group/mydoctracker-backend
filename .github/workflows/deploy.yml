name: Deploy to Development

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: development

    env:
      DEPLOY_PATH: '/home/ubuntu/doc-tracker-backend-dev'
      PORT: 3001
      MYSQL_HOST: localhost
      MYSQL_USER: dev
      MYSQL_PASSWORD: jL#4p@*9vT$!7
      MYSQL_DATABASE: mydoctracker_dev
      MYSQL_PORT: 3306

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '14'

    - name: Install dependencies
      run: |
        npm install

    - name: Build application
      run: |
        npm run build

    - name: Restart NestJS application
      run: pm2 restart $DEPLOY_PATH/dist/src/main.js
